<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
  <title id="title">Fertiges Tic-Tac-Toe</title>
  <desc id="desc">Ada mit X gewinnt gegen Ben mit O. Die Diagonale 0, 4, 8 ist die Gewinnlinie.</desc>
  <rect width="480" height="560" rx="24" fill="#231f20"/>
  <text x="40" y="52" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Tic-Tac-Toe</text>
  <text x="40" y="76" fill="#8d8a8b" font-family="Segoe UI, sans-serif" font-size="13">ein Browser, zwei Spieler</text>

  <rect x="40" y="100" width="184" height="72" rx="12" fill="#2c292a"/>
  <text x="56" y="128" fill="#8d8a8b" font-family="Segoe UI, sans-serif" font-size="12">X</text>
  <text x="56" y="152" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Ada</text>
  <text x="196" y="152" fill="#00baea" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="end">1</text>

  <rect x="256" y="100" width="184" height="72" rx="12" fill="#2c292a"/>
  <text x="272" y="128" fill="#8d8a8b" font-family="Segoe UI, sans-serif" font-size="12">O</text>
  <text x="272" y="152" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Ben</text>
  <text x="416" y="152" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="end">0</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="78" y="196" width="100" height="100" rx="12" fill="#e7f8fd"/>
    <text x="90" y="214" fill="#7f969c" font-size="12">0</text>
    <text x="128" y="258" fill="#231f20" font-size="42" font-weight="700" text-anchor="middle">X</text>

    <rect x="190" y="196" width="100" height="100" rx="12" fill="#2c292a"/>
    <text x="202" y="214" fill="#8d8a8b" font-size="12">1</text>
    <text x="240" y="258" fill="#00baea" font-size="42" font-weight="700" text-anchor="middle">O</text>

    <rect x="302" y="196" width="100" height="100" rx="12" fill="#2c292a"/>
    <text x="314" y="214" fill="#8d8a8b" font-size="12">2</text>

    <rect x="78" y="308" width="100" height="100" rx="12" fill="#2c292a"/>
    <text x="90" y="326" fill="#8d8a8b" font-size="12">3</text>
    <text x="128" y="370" fill="#00baea" font-size="42" font-weight="700" text-anchor="middle">O</text>

    <rect x="190" y="308" width="100" height="100" rx="12" fill="#e7f8fd"/>
    <text x="202" y="326" fill="#7f969c" font-size="12">4</text>
    <text x="240" y="370" fill="#231f20" font-size="42" font-weight="700" text-anchor="middle">X</text>

    <rect x="302" y="308" width="100" height="100" rx="12" fill="#2c292a"/>
    <text x="314" y="326" fill="#8d8a8b" font-size="12">5</text>

    <rect x="78" y="420" width="100" height="100" rx="12" fill="#2c292a"/>
    <text x="90" y="438" fill="#8d8a8b" font-size="12">6</text>

    <rect x="190" y="420" width="100" height="100" rx="12" fill="#2c292a"/>
    <text x="202" y="438" fill="#8d8a8b" font-size="12">7</text>

    <rect x="302" y="420" width="100" height="100" rx="12" fill="#e7f8fd"/>
    <text x="314" y="438" fill="#7f969c" font-size="12">8</text>
    <text x="352" y="482" fill="#231f20" font-size="42" font-weight="700" text-anchor="middle">X</text>
  </g>

  <line x1="128" y1="246" x2="352" y2="470" stroke="#00baea" stroke-width="8" stroke-linecap="round"/>
  <text x="240" y="548" fill="#00baea" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">X gewinnt</text>
</svg>
